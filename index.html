<script>
const T={ko:{tag:'좋은 술과 맛있는 전, 편안한 밤',intro:'산체스 바의 전통주와 안주를 소개합니다.',foot:'AN-GUK, SEOUL · 알레르기 정보는 직원에게 문의해 주세요',cat:['막걸리','전통주','전 & 안주','사이드 메뉴','음료']},en:{tag:'Good drinks, good food, an easy night.',intro:'A selection of Korean drinks and food at Sanchez BAR.',foot:'AN-GUK, SEOUL · PLEASE ASK OUR STAFF FOR ALLERGEN INFORMATION',cat:['Makgeolli','Traditional Spirits','Jeon & Food','Sides','Drinks']},ja:{tag:'良いお酒とおいしいチヂミ、心地よい夜を。',intro:'Sanchez BARの韓国伝統酒とおつまみをご紹介します。',foot:'AN-GUK, SEOUL · アレルギーに関してはスタッフまでお尋ねください',cat:['マッコリ','韓国伝統酒','チヂミ & おつまみ','サイドメニュー','ドリンク']}};
const M=[
['makgeolli','MAKGEOLLI',[
['호랑이 막걸리','Tiger Makgeolli','虎マッコリ','멸균위기인 ‘매화와 봄쌀’로 빚은 유기농 프리미엄 막걸리. 탄산이 적고 깔끔하며, 목넘김이 부드러운 막걸리.','An organic premium makgeolli made with Maehwa and spring rice. Low in carbonation, clean and silky on the palate.','「梅花と春米」で醸したオーガニック・プレミアムマッコリ。炭酸は控えめで、すっきりとなめらかな飲み口です。','12,000'],
['대대포 막걸리','Daedaepo Makgeolli','テデポ・マッコリ','전라남도 담양의 죽향도가 양조장. 벌꿀의 은은한 향과 유기농 쌀의 환상 콜라보. 목넘김이 부드럽고 적당히 달달한 막걸리.','From Jukhyang Brewery in Damyang. Gentle honey notes meet organic rice in this smooth, pleasantly sweet makgeolli.','全羅南道・潭陽の竹香醸造所のマッコリ。ほのかな蜂蜜の香りと有機米が調和した、なめらかで程よい甘さです。','9,000'],
['느린마을 막걸리','Neurinmaeul Makgeolli','ヌリンマウル・マッコリ','배상면주가에서 만든 아스파탐을 첨가하지 않은 막걸리. 배 향을 느낄 수 있으며 부드럽고 적당히 달달해 호불호가 없는 막걸리.','Aspartame-free makgeolli with delicate pear aroma, soft texture and balanced sweetness.','アスパルテーム不使用。ほのかな梨の香り、やわらかな口当たりと程よい甘さが特徴です。','9,000'],
['선호 막걸리','Seonho Makgeolli','ソンホ・マッコリ','밸런스가 아주 좋은 막걸리. 누구나 선호하는 막걸리. 많이 달지 않은 막걸리를 선호하는 분께 추천.','A beautifully balanced, not-too-sweet makgeolli—an easy favorite for everyone.','バランスに優れた、甘さ控えめのマッコリ。甘すぎるお酒が苦手な方にもおすすめです。','7,000'],
['송명섭 막걸리','Song Myeong-seop Makgeolli','ソン・ミョンソプ・マッコリ','막걸리계의 평양냉면. 무형문화재 송명섭옹께서 빚으신 막걸리. 우리 쌀로 만드는 누룩, 물 외에는 아무것도 첨가하지 않은 오리지널 막걸리. Super dry.','A super-dry original makgeolli by master brewer Song Myeong-seop—nothing added but Korean rice, nuruk and water.','名人ソン・ミョンソプ氏が醸す、韓国米・麹・水だけのオリジナルマッコリ。キレのある超辛口です。','11,000'],
['공주 알밤 막걸리','Gongju Chestnut Makgeolli','公州アルバム（栗）マッコリ','충남 공주의 알밤 막걸리. 맛과 향이 들어간 막걸리 중 꽤나 찰밥이 되는 달달구리 막걸리.','A sweet chestnut makgeolli from Gongju, richly flavored and aromatic.','忠清南道・公州産の栗マッコリ。風味豊かで、しっかりとした甘さを楽しめます。','7,000'],
['고흥 유자 막걸리','Goheung Yuja Makgeolli','高興ユジャ（柚子）マッコリ','유자의 고향 전라남도 고흥 출신. 상큼한 유자향이 매력적인 막걸리.','A refreshing makgeolli from Goheung, the home of yuja, with an inviting citrus fragrance.','柚子の名産地、全羅南道・高興のマッコリ。爽やかな柚子の香りが魅力です。','7,000']]],
['spirits','TRADITIONAL SPIRITS',[
['오메기술 13도','Omegi Sul 13%','オメギ酒 13度','제주도의 천연 암반수로 빚은 약주. 은은한 단맛과 고소하면서 부드러운 산미.','A refined rice wine made with Jeju’s natural bedrock water; gently sweet with mellow, savory acidity.','済州島の天然岩盤水で醸した薬酒。ほのかな甘みと香ばしくやわらかな酸味が特徴です。','15,000'],
['명인 안동소주 22도','Master Andong Soju 22%','名人 安東焼酎 22度','은은하게 올라오는 매실의 향을 느낄 수 있는 전통 증류주. 차 또는 소다, 토닉과 믹스해서 마시기 좋은 술.','A traditional spirit with soft plum notes. Delicious mixed with tea, soda or tonic.','ほのかな梅の香りが広がる韓国伝統蒸留酒。お茶、ソーダ、トニックとのミックスにもよく合います。','13,000'],
['추사 백 25도','Chusa Baek 25%','秋史 白 25度','추사 김정희 선생의 고향인 예산의 사과로 만든 사과 증류주. 천천히 음미하며 마시기 좋은 술.','An apple spirit made in Yesan, best savored slowly.','秋史・金正喜の故郷、礼山のりんごで造った蒸留酒。ゆっくりと味わいたい一杯です。','27,000'],
['문경바람 백자 25도','Mungyeong Baram Baekja 25%','聞慶バラム 白磁 25度','문경 도자기에서 숙성한 증류주. 달달한 사과의 향을 품고 있지만 인위적인 단맛이 없어 깔끔하게 마시기 좋은 술.','A spirit matured in Mungyeong pottery. Sweet apple aromas without artificial sweetness make for a clean finish.','聞慶の陶器で熟成させた蒸留酒。甘いりんごの香りを持ちながら人工的な甘さはなく、すっきりとした味わいです。','33,000'],
['만월 24도','Manwol 24%','満月 24度','경북 예천에서 재배한 복분자로 만든 증류주. 맑고 투명한 빛이 예쁘고, 청량하고 뒷맛이 깔끔함.','A distilled bokbunja (black raspberry) spirit: crystal clear, refreshing and clean on the finish.','慶尚北道・醴泉産の覆盆子（ポップンジャ）で造った蒸留酒。透明感があり、爽やかで後味もすっきりです。','26,000'],
['서울의 밤 25도',"Seoul's Night 25%",'ソウルの夜 25度','은은하게 올라오는 매실의 향을 느낄 수 있는 전통 증류주. 토닉워터와 함께 마시기 좋은 술.','A traditional spirit with gentle plum notes, especially good with tonic water.','ほのかな梅の香りが楽しめる伝統蒸留酒。トニックウォーターと合わせるのがおすすめです。','15,000'],
['문경바람 오크 오차와리 잔술','Mungyeong Baram Oak · Ocha-wari','聞慶バラム オーク・お茶割り','문경바람 특유의 향긋한 사과향과 오크통에서 우러나오는 삼나무향이 잘 블렌드된 증류주를 베이스로 한 잔술.','A glass of Mungyeong Baram Oak: fragrant apple and cedar notes, served ocha-wari style.','りんごの華やかな香りと、オーク樽由来の杉のような香りが調和した蒸留酒を使った、お茶割りの一杯です。','8,000']]],
['jeon','JEON & FOOD',[
['미국 감자전','American Potato Jeon','アメリカンじゃがいもチヂミ','산체스 막걸리의 시그니처 메뉴. 스위스의 대표적 가정식 ‘뢰스티’에서 착안한 요리. 얇게 채썬 감자에 베이컨, 새우 등을 같이 버무려 부쳐낸 감자전.','Sanchez’s signature. Inspired by Swiss rösti: finely shredded potato, bacon and shrimp pan-fried until crisp.','Sanchezのシグネチャー。スイスの家庭料理ロシュティから着想を得た、細切りじゃがいも、ベーコン、えびを香ばしく焼いたチヂミです。','23,000'],
['바지락 술찜','Clam Sake Stew','あさりの酒蒸し','유럽의 바지락 술찜과 일본의 ‘아사리노 사카무시’ 그 중간쯤 있는 요리. 바지락 육수에 청주의 부드러움과 청양고추의 칼칼함을 더한 국물안주.','Somewhere between European clams in wine and Japanese asari no sakamushi, with clam broth, Korean rice wine and a chili kick.','ヨーロッパの貝の酒蒸しと日本のあさりの酒蒸しの中間のような一品。貝のだしに清酒のまろやかさと青唐辛子の辛みを加えました。','21,000'],
['부추 꼬꼬전','Chicken & Chive Jeon','鶏肉とニラのチヂミ','갈비양념에 재운 닭다리살과 피를 맑게 해주는 부추의 만남. 색다른 전이 먹어보고 싶다면 추천.','Marinated chicken thigh and generous chives come together in this distinctive jeon.','カルビだれに漬けた鶏もも肉とたっぷりのニラのチヂミ。いつもと違うチヂミを試したい方におすすめです。','18,000'],
['김치전','Kimchi Jeon','キムチチヂミ','Simple is the best. 다 아는 그 맛이지만 바삭하니 맛있음. 계란후라이 추가 +1,000원.','Simple is best: the familiar, irresistible crisp kimchi pancake. Add a fried egg for ₩1,000.','シンプル・イズ・ベスト。みんなが知っているあの味を、カリッと焼き上げました。目玉焼き追加 +₩1,000。','13,000'],
['땡초 부추전','Spicy Chive Jeon','青唐辛子とニラのチヂミ','부추전에 청양고추를 더한 메뉴. 부추가 아주 가득가득 들어있어 건강해질 것 같은 맛.','A generous chive pancake with Cheongyang chili peppers for a bright, spicy kick.','たっぷりのニラに青陽唐辛子を加えたチヂミ。爽やかな辛みがアクセントです。','14,000']]],
['side','SIDE MENU',[
['계란라면','Egg Ramen','卵ラーメン','산체스의 두번째 시그니처 메뉴. 계란찜과 라면의 콜라보.','Sanchez’s second signature: a comforting marriage of steamed egg and ramen.','Sanchezのもうひとつのシグネチャー。茶碗蒸しのような卵とラーメンを合わせた、ほっとする一品です。','9,000'],
